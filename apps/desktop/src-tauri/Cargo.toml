[package]
name = "khipu"
version = "0.3.0"
description = "Khipu — conversation memory hub desktop shell"
authors = ["Matthew Schwartz"]
edition = "2021"

[lib]
name = "khipu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Binary name must not be `khipu` — Tauri bundles CLI resources to `khipu/`
# under target/release/, which would collide with a binary of that name.
[[bin]]
name = "Khipu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
